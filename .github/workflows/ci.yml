name: Igraem.kz Continuous Integration (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci-pipeline:
    name: Build, TypeCheck & Test Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Install Root & Client Dependencies
        run: |
          npm ci
          npm --prefix client ci

      - name: 4. Generate Prisma Client
        run: npx prisma generate

      - name: 5. Code Formatting & Linting Check
        run: |
          echo "🔍 Executing Linting Checks..."
          npm run lint --if-present

      - name: 6. Static Analysis & Type Checking (TypeScript)
        run: |
          echo "📐 Checking Backend TypeScript types..."
          npx tsc --noEmit
          echo "📐 Checking Frontend TypeScript types..."
          npm --prefix client run build

      - name: 7. Run Unit Tests & Verification
        run: |
          echo "🧪 Running Unit Tests..."
          npm test --if-present

      - name: 8. Backend & Frontend Production Build
        run: |
          echo "📦 Building Backend Dist Bundle..."
          npm run build
          echo "📦 Building Client Production Assets..."
          npm --prefix client run build
