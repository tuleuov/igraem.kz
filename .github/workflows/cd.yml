name: Igraem.kz CD Continuous Deployment

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    name: Production Deployment
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies & Build Bundle
        run: |
          npm ci
          npm --prefix client ci
          npm --prefix client run build
          npx tsc

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Deployment Verification Summary
        run: |
          echo "✅ Production Docker image ghcr.io/${{ github.repository }}:${{ github.sha }} successfully built and deployed!"
